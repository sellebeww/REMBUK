name: CI
on:
  push:
    branches: [main, 'improve/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test unit dan RLS (PGlite)
        run: npm test
      - name: Build
        run: npm run build
      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
